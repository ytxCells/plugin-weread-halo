<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:with="version = '1.2.2'">
<body>
<th:block th:fragment="bookmark(items, currentPage, totalPages, pageSize, totalItems)">
    <h1>划线</h1>
    <div class="bookmark-content">
        <div th:if="${items == null or items.isEmpty()}">
            <p>暂无划线</p>
        </div>

        <div th:unless="${items == null or items.isEmpty()}">
            <div class="bookmark-container">
                <div th:each="bookmark : ${items}" class="bookmark-card">
                    <div class="bookmark-content" th:text="${bookmark.markText}"></div>
                    <div class="bookmark-meta">
                        <div>
                            <span class="bookmark-book" th:text="${bookmark.bookId}"></span>
                            <span th:if="${bookmark.chapterUid != null}"
                                  th:text="' · 章节 ' + ${bookmark.chapterUid}"></span>
                        </div>
                        <div class="bookmark-time"
                             th:text="${bookmark.createTime} ?: '未知时间'"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 分页导航 -->
        <nav aria-label="Page navigation" th:if="${totalPages != null and totalPages > 1 and totalItems != null and totalItems > 0}">
            <ul style="list-style-type: none;" class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == null or currentPage <= 1} ? 'disabled'">
                    <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${currentPage != null ? currentPage - 1 : 1}, size=${pageSize != null ? pageSize : 10},type=2)}" th:text="上一页"></a>
                </li>
                <!-- 使用 th:with 提前计算起始和结束页码 -->
                <th:block th:with="startPage=${currentPage != null and totalPages != null ? (currentPage - 5 > 1 ? currentPage - 5 : 1) : 1},
                                       endPage=${currentPage != null and totalPages != null ? (currentPage + 5 < totalPages ? currentPage + 5 : totalPages) : 1}">
                    <li class="page-item" th:each="page : ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${currentPage != null and currentPage == page} ? 'active'">
                        <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${page}, size=${pageSize != null ? pageSize : 10},type=2)}" th:text="${page}"></a>
                    </li>
                </th:block>
                <li class="page-item" th:classappend="${currentPage == null or totalPages == null or currentPage >= totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${currentPage != null ? currentPage + 1 : 2}, size=${pageSize != null ? pageSize : 10},type=2)}" th:text="下一页"></a>
                </li>
            </ul>
        </nav>
    </div>

</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="https://www.thymeleaf.org">

<head>
    <title th:text="${title} + ' - ' + ${book.title}">书籍详情</title>
    <link rel="stylesheet" href="/css/weread.css">
</head>

<body>
<header class="header">
    <a href="/weread" class="btn-back">← 返回书架</a>
    <h1 th:text="${book.title}">书名</h1>
</header>

<main class="container">
    <div class="book-detail">
        <img th:src="${book.cover}" alt="书籍封面" class="detail-cover">

        <div class="detail-info">
            <h2 th:text="${book.title}">书名</h2>
            <p th:text="'作者: ' + ${book.author}">作者</p>
            <div class="reading-stats">
                <p th:text="'阅读进度: ' + ${book.progress} + '%'">进度</p>
                <p th:text="'阅读时长: ' + ${book.readingTime}">时长</p>
            </div>

            <div class="reviews-section">
                <h3>我的笔记</h3>
                <div class="review-list">
                    <div class="review-item" th:each="review : ${book.reviews}">
                        <p class="chapter" th:text="${review.chapter}">章节</p>
                        <p class="content" th:text="${review.content}">笔记内容</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div th:insert="~{fragments/layout :: copy}"></div>
</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:with="version = '1.2.2'">
<body>
<th:block th:fragment="bookshelf(books, currentPage, totalPages, pageSize, totalItems)">
    <h1>书架</h1>
    <div class="bookshelf-content">
        <div th:if="${books == null or books.isEmpty()}">
            <p>暂无书籍</p>
        </div>
        <div th:unless="${books == null or books.isEmpty()}">
            <div class="book-shelf row">
                <div th:each="book : ${books}" class="book-card col-md-3">
                    <img th:src="${book.cover != null ? book.cover : '/plugins/plugin-weread/assets/static/images/default-cover.jpg'}" alt="书籍封面" class="book-cover img-fluid"/>
                    <div class="book-info">
                        <h3 class="book-title" th:text="${book.title != null ? book.title : '未知标题'}">书名</h3>
                        <p class="book-author" th:text="${book.author != null ? book.author : '未知作者'}">作者</p>
                    </div>
                </div>
            </div>
            <!-- 分页导航 -->
            <nav aria-label="Page navigation" th:if="${totalPages != null and totalPages > 1 and totalItems != null and totalItems > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == null or currentPage <= 1} ? 'disabled'">
                        <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${currentPage != null ? currentPage - 1 : 1}, size=${pageSize != null ? pageSize : 10})}" th:text="上一页"></a>
                    </li>

                    <!-- 使用 th:with 提前计算起始和结束页码 -->
                    <th:block th:with="startPage=${currentPage != null and totalPages != null ? (currentPage - 5 > 1 ? currentPage - 5 : 1) : 1},
                                       endPage=${currentPage != null and totalPages != null ? (currentPage + 5 < totalPages ? currentPage + 5 : totalPages) : 1}">
                        <li class="page-item" th:each="page : ${#numbers.sequence(startPage, endPage)}"
                            th:classappend="${currentPage != null and currentPage == page} ? 'active'">
                            <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${page}, size=${pageSize != null ? pageSize : 10})}" th:text="${page}"></a>
                        </li>
                    </th:block>
                    <li class="page-item" th:classappend="${currentPage == null or totalPages == null or currentPage >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${currentPage != null ? currentPage + 1 : 2}, size=${pageSize != null ? pageSize : 10})}" th:text="下一页"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" th:with="version = '1.2.2'">
<body>
<th:block th:fragment="review(items, currentPage, totalPages, pageSize, totalItems)">
    <h1>笔记</h1>
    <div class="review-content">
        <div th:if="${items == null or items.isEmpty()}">
            <p>暂无笔记</p>
        </div>
        <div th:unless="${items == null or items.isEmpty()}">
            <div class="review-list">
                <div th:each="review : ${items}" class="review-item">
                    <div th:text="${review.content}"></div>
                    <div th:text="${review.chapterTitle}"></div>
                    <div th:text="${review.bookId}"></div>
                    <div th:text="${review.reviewId}"></div>
                </div>
            </div>
            <!-- 分页导航 -->
            <nav aria-label="Page navigation" th:if="${totalPages != null and totalPages > 1 and totalItems != null and totalItems > 0}">
                <ul style="list-style-type: none;" class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == null or currentPage <= 1} ? 'disabled'">
                        <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${currentPage != null ? currentPage - 1 : 1}, size=${pageSize != null ? pageSize : 10},type=3)}" th:text="上一页"></a>
                    </li>
                    <!-- 使用 th:with 提前计算起始和结束页码 -->
                    <th:block th:with="startPage=${currentPage != null and totalPages != null ? (currentPage - 5 > 1 ? currentPage - 5 : 1) : 1},
                                       endPage=${currentPage != null and totalPages != null ? (currentPage + 5 < totalPages ? currentPage + 5 : totalPages) : 1}">
                        <li class="page-item" th:each="page : ${#numbers.sequence(startPage, endPage)}"
                            th:classappend="${currentPage != null and currentPage == page} ? 'active'">
                            <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${page}, size=${pageSize != null ? pageSize : 10},type=3)}" th:text="${page}"></a>
                        </li>
                    </th:block>
                    <li class="page-item" th:classappend="${currentPage == null or totalPages == null or currentPage >= totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{${#httpServletRequest.requestURI}(page=${currentPage != null ? currentPage + 1 : 2}, size=${pageSize != null ? pageSize : 10},type=3)}" th:text="下一页"></a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</th:block>
</body>
</html>
